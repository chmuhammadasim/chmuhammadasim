<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>◈ GRID SNAKE — chmuhammadasim</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon: #00ffcc;
    --purple: #7722ff;
    --dark: #03000f;
    --dark2: #060020;
    --mid: #0a0030;
    --text: #b0ffd8;
    --dim: #336655;
    --warn: #ff3366;
    --gold: #ffcc00;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    user-select: none;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* CRT flicker */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
    z-index: 99;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 12px;
    padding: 12px;
  }

  /* ── HEADER ── */
  #header {
    text-align: center;
    line-height: 1.3;
  }
  #header .title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 900;
    color: var(--neon);
    text-shadow: 0 0 20px var(--neon), 0 0 40px var(--neon);
    letter-spacing: 6px;
    animation: flicker 4s infinite;
  }
  #header .sub {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 3px;
    margin-top: 2px;
  }
  #header .sub span { color: var(--purple); }

  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.5; }
    99% { opacity: 1; }
  }

  /* ── HUD BAR ── */
  #hud {
    display: flex;
    gap: 24px;
    font-size: 12px;
    letter-spacing: 2px;
    width: 100%;
    max-width: 520px;
    justify-content: space-between;
    border: 1px solid var(--dim);
    padding: 6px 14px;
    position: relative;
  }
  #hud::before {
    content: '◈ HUD';
    position: absolute; top: -9px; left: 10px;
    background: var(--dark);
    padding: 0 6px;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 2px;
  }
  .hud-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .hud-label { color: var(--dim); font-size: 9px; letter-spacing: 3px; }
  .hud-val { color: var(--neon); font-size: 15px; font-weight: bold; text-shadow: 0 0 8px var(--neon); }
  #level-val { color: var(--purple); text-shadow: 0 0 8px var(--purple); }
  #hi-val { color: var(--gold); text-shadow: 0 0 8px var(--gold); }

  /* ── CANVAS WRAPPER ── */
  #canvas-wrap {
    position: relative;
    border: 1px solid var(--purple);
    box-shadow: 0 0 20px rgba(119,34,255,0.4), inset 0 0 30px rgba(0,0,0,0.8),
                0 0 60px rgba(0,255,204,0.08);
  }
  #canvas-wrap::before, #canvas-wrap::after {
    content: '';
    position: absolute;
    border: 1px solid var(--neon);
    opacity: 0.3;
  }
  #canvas-wrap::before { inset: 4px; }
  #canvas-wrap::after  { inset: 8px; }

  /* corner decorations */
  .corner {
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--neon);
    border-style: solid;
    opacity: 0.9;
    z-index: 2;
  }
  .corner.tl { top: -1px; left: -1px;  border-width: 2px 0 0 2px; }
  .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: -1px; left: -1px;  border-width: 0 0 2px 2px; }
  .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  canvas { display: block; }

  /* ── OVERLAY ── */
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(3,0,15,0.88);
    gap: 10px;
    z-index: 10;
  }
  #overlay.hidden { display: none; }

  .ov-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 2.5vw, 22px);
    font-weight: 900;
    letter-spacing: 4px;
    text-align: center;
  }
  .ov-title.green  { color: var(--neon); text-shadow: 0 0 20px var(--neon); }
  .ov-title.red    { color: var(--warn); text-shadow: 0 0 20px var(--warn); }
  .ov-sub {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 3px;
    text-align: center;
  }
  .ov-stat {
    font-size: 12px;
    color: var(--text);
    letter-spacing: 2px;
    margin-top: 4px;
  }
  .ov-stat b { color: var(--neon); }

  #start-btn {
    margin-top: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--dark);
    background: var(--neon);
    border: none;
    padding: 10px 28px;
    cursor: pointer;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    text-transform: uppercase;
    transition: all 0.15s;
    box-shadow: 0 0 20px rgba(0,255,204,0.5);
    animation: pulse-btn 2s infinite;
  }
  #start-btn:hover {
    background: var(--dark);
    color: var(--neon);
    box-shadow: 0 0 30px var(--neon);
    outline: 1px solid var(--neon);
  }
  @keyframes pulse-btn {
    0%,100% { box-shadow: 0 0 20px rgba(0,255,204,0.5); }
    50%      { box-shadow: 0 0 40px rgba(0,255,204,0.9); }
  }

  /* ── CONTROLS ── */
  #controls {
    display: flex;
    gap: 6px;
    flex-direction: column;
    align-items: center;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 2px;
  }
  .ctrl-row { display: flex; gap: 6px; }
  .key {
    background: rgba(119,34,255,0.15);
    border: 1px solid var(--dim);
    color: var(--text);
    padding: 3px 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
  }

  /* ── FOOTER TAG ── */
  #footer-tag {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 3px;
    text-align: center;
  }
  #footer-tag a { color: var(--purple); text-decoration: none; }
  #footer-tag a:hover { color: var(--neon); }

  /* mobile d-pad */
  #dpad {
    display: none;
    gap: 4px;
    flex-direction: column;
    align-items: center;
  }
  .dpad-row { display: flex; gap: 4px; }
  .dpad-btn {
    width: 44px; height: 44px;
    background: rgba(119,34,255,0.15);
    border: 1px solid var(--purple);
    color: var(--neon);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active { background: rgba(0,255,204,0.2); }
  .dpad-blank { width: 44px; height: 44px; }

  @media (max-width: 600px) {
    #dpad { display: flex; }
    #controls .ctrl-label { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="title">◈ GRID SNAKE ◈</div>
    <div class="sub">OPERATOR: <span>@chmuhammadasim</span> · NODE: <span>github.com/chmuhammadasim</span></div>
  </div>

  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">SCORE</span>
      <span class="hud-val" id="score-val">000</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">LEVEL</span>
      <span class="hud-val" id="level-val">01</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">LENGTH</span>
      <span class="hud-val" id="len-val">03</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">HI-SCORE</span>
      <span class="hud-val" id="hi-val">000</span>
    </div>
  </div>

  <div id="canvas-wrap">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <canvas id="c"></canvas>
    <div id="overlay">
      <div class="ov-title green" id="ov-title">◈ GRID SNAKE ◈</div>
      <div class="ov-sub" id="ov-sub">NEURAL GRID INFILTRATION PROTOCOL</div>
      <div class="ov-stat" id="ov-stat"></div>
      <button id="start-btn">[ BOOT SEQUENCE ]</button>
    </div>
  </div>

  <div id="controls">
    <div class="ctrl-row">
      <span class="key">W</span><span class="key">↑</span>
      <span style="padding:0 8px;line-height:26px;">MOVE</span>
      <span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <span class="key">↓</span><span class="key">←</span><span class="key">→</span>
    </div>
    <span class="ctrl-label" style="font-size:10px;color:var(--dim);letter-spacing:2px;">
      COLLECT ◈ DATA PACKETS · AVOID ░ GRID WALLS
    </span>
  </div>

  <div id="dpad">
    <div class="dpad-row">
      <div class="dpad-blank"></div>
      <button class="dpad-btn" data-dir="UP">▲</button>
      <div class="dpad-blank"></div>
    </div>
    <div class="dpad-row">
      <button class="dpad-btn" data-dir="LEFT">◀</button>
      <div class="dpad-blank" style="background:rgba(119,34,255,0.05);border:1px solid #333;"></div>
      <button class="dpad-btn" data-dir="RIGHT">▶</button>
    </div>
    <div class="dpad-row">
      <div class="dpad-blank"></div>
      <button class="dpad-btn" data-dir="DOWN">▼</button>
      <div class="dpad-blank"></div>
    </div>
  </div>

  <div id="footer-tag">
    ◈ BUILT BY <a href="https://github.com/chmuhammadasim" target="_blank">@chmuhammadasim</a> ◈ SNSKIES PVT LTD ◈ ISLAMABAD, PK ◈
  </div>

</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const COLS = 22, ROWS = 20, CELL = 22;
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;

const C = { neon:'#00ffcc', purple:'#7722ff', dark:'#03000f', dark2:'#060020',
            mid:'#0a0030', text:'#b0ffd8', dim:'#224433', warn:'#ff3366',
            gold:'#ffcc00', head:'#00ffff' };

// State
let snake, dir, nextDir, food, bonusFood, score, hiScore, level, speed, gameLoop,
    alive, particles, bonusTimer, bonusCooldown, frameCount;

hiScore = parseInt(localStorage.getItem('gridsnake_hi') || '0');
document.getElementById('hi-val').textContent = String(hiScore).padStart(3,'0');

function initGame() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; level = 1; speed = 120;
  alive = true; particles = []; bonusFood = null;
  bonusTimer = 0; bonusCooldown = 0; frameCount = 0;
  placeFood();
  updateHUD();
}

function placeFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
  } while (snake.some(s=>s.x===pos.x&&s.y===pos.y));
  food = { ...pos, pulse: 0 };
}

function placeBonusFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
  } while (snake.some(s=>s.x===pos.x&&s.y===pos.y) || (food&&pos.x===food.x&&pos.y===food.y));
  bonusFood = { ...pos, life: 100, pulse: 0 };
}

function updateHUD() {
  document.getElementById('score-val').textContent = String(score).padStart(3,'0');
  document.getElementById('level-val').textContent  = String(level).padStart(2,'0');
  document.getElementById('len-val').textContent    = String(snake.length).padStart(2,'0');
  document.getElementById('hi-val').textContent     = String(hiScore).padStart(3,'0');
}

// Particles
function spawnParticles(x,y,color,count=6) {
  for (let i=0;i<count;i++) {
    const angle = (Math.PI*2/count)*i + Math.random()*0.5;
    const speed = 1.5 + Math.random()*2.5;
    particles.push({ x: x*CELL+CELL/2, y: y*CELL+CELL/2,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 1, color, size: 2+Math.random()*2 });
  }
}

function updateParticles() {
  for (let i=particles.length-1;i>=0;i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(i,1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
}

// Draw
function draw() {
  // BG
  ctx.fillStyle = C.dark;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.strokeStyle = C.dim;
  ctx.lineWidth = 0.3;
  for(let x=0;x<=COLS;x++){
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke();
  }
  for(let y=0;y<=ROWS;y++){
    ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke();
  }

  // Food pulse
  food.pulse = (food.pulse + 0.08) % (Math.PI*2);
  const fp = Math.sin(food.pulse)*0.4+0.6;

  // Food — data packet (diamond shape)
  ctx.save();
  ctx.translate(food.x*CELL+CELL/2, food.y*CELL+CELL/2);
  ctx.rotate(Math.PI/4 + food.pulse*0.3);
  const fs = CELL*0.38*fp;
  ctx.fillStyle = C.neon;
  ctx.shadowColor = C.neon; ctx.shadowBlur = 14*fp;
  ctx.fillRect(-fs,-fs,fs*2,fs*2);
  ctx.shadowBlur = 0;
  // inner
  ctx.fillStyle = C.dark;
  ctx.fillRect(-fs*0.45,-fs*0.45,fs*0.9,fs*0.9);
  ctx.restore();

  // Bonus food — gold token
  if (bonusFood) {
    bonusFood.pulse = (bonusFood.pulse + 0.12) % (Math.PI*2);
    const bp = Math.sin(bonusFood.pulse)*0.5+0.5;
    ctx.save();
    ctx.translate(bonusFood.x*CELL+CELL/2, bonusFood.y*CELL+CELL/2);
    const br = CELL*0.38;
    ctx.beginPath(); ctx.arc(0,0,br,0,Math.PI*2);
    ctx.fillStyle = C.gold; ctx.shadowColor = C.gold; ctx.shadowBlur = 18*bp;
    ctx.fill();
    ctx.fillStyle = C.dark; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(0,0,br*0.5,0,Math.PI*2); ctx.fill();
    // life bar ring
    ctx.beginPath();
    ctx.arc(0,0,br+3, -Math.PI/2, -Math.PI/2 + Math.PI*2*(bonusFood.life/100));
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // Snake
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const t = 1 - i/snake.length;
    const pad = isHead ? 1 : 2+i*0.05;

    // glow for head
    if (isHead) {
      ctx.shadowColor = C.neon; ctx.shadowBlur = 16;
    } else {
      ctx.shadowColor = C.purple; ctx.shadowBlur = 6*t;
    }

    // body color gradient
    const r = Math.round(0   + (119-0)*t);
    const g = Math.round(255 + (34-255)*t);
    const b = Math.round(204 + (255-204)*t);
    ctx.fillStyle = isHead ? C.head : `rgb(${r},${g},${b})`;
    ctx.fillRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-pad*2, CELL-pad*2);

    // head eyes
    if (isHead) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = C.dark;
      const eyeSize = 3, ex = CELL*0.25, ey = CELL*0.3;
      if (dir.x===1)  { ctx.fillRect(seg.x*CELL+CELL-6, seg.y*CELL+ey, eyeSize,eyeSize); ctx.fillRect(seg.x*CELL+CELL-6, seg.y*CELL+CELL-ey-eyeSize, eyeSize,eyeSize); }
      if (dir.x===-1) { ctx.fillRect(seg.x*CELL+3,      seg.y*CELL+ey, eyeSize,eyeSize); ctx.fillRect(seg.x*CELL+3,      seg.y*CELL+CELL-ey-eyeSize, eyeSize,eyeSize); }
      if (dir.y===1)  { ctx.fillRect(seg.x*CELL+ex,      seg.y*CELL+CELL-6, eyeSize,eyeSize); ctx.fillRect(seg.x*CELL+CELL-ex-eyeSize, seg.y*CELL+CELL-6, eyeSize,eyeSize); }
      if (dir.y===-1) { ctx.fillRect(seg.x*CELL+ex,      seg.y*CELL+3, eyeSize,eyeSize); ctx.fillRect(seg.x*CELL+CELL-ex-eyeSize, seg.y*CELL+3, eyeSize,eyeSize); }
    }
    ctx.shadowBlur = 0;
  });

  updateParticles(); drawParticles();

  // Score flash
  if (frameCount % 60 < 5 && score > 0) {
    ctx.fillStyle = `rgba(0,255,204,0.04)`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
}

// Game tick
function tick() {
  if (!alive) return;
  frameCount++;

  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) { die(); return; }
  // Self collision
  if (snake.some(s=>s.x===head.x&&s.y===head.y)) { die(); return; }

  let grow = false;

  // Food collision
  if (head.x===food.x && head.y===food.y) {
    grow = true;
    const pts = level * 10;
    score += pts;
    spawnParticles(food.x, food.y, C.neon, 8);
    placeFood();
    // level up
    if (score >= level * 50) {
      level++;
      speed = Math.max(55, speed - 12);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
      // flash
      spawnParticles(snake[0].x, snake[0].y, C.purple, 12);
    }
    // bonus spawn chance
    bonusCooldown--;
    if (!bonusFood && bonusCooldown <= 0 && Math.random() < 0.4) {
      placeBonusFood();
      bonusCooldown = 3;
    }
  }

  // Bonus collision
  if (bonusFood && head.x===bonusFood.x && head.y===bonusFood.y) {
    grow = true;
    score += level * 30;
    spawnParticles(bonusFood.x, bonusFood.y, C.gold, 12);
    bonusFood = null;
  }

  snake.unshift(head);
  if (!grow) snake.pop();

  // Bonus food timeout
  if (bonusFood) {
    bonusFood.life -= 1.4;
    if (bonusFood.life <= 0) bonusFood = null;
  }

  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('gridsnake_hi', hiScore);
  }

  updateHUD();
  draw();
}

function die() {
  alive = false;
  clearInterval(gameLoop);
  spawnParticles(snake[0].x, snake[0].y, C.warn, 16);
  draw();

  const ov = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovSub   = document.getElementById('ov-sub');
  const ovStat  = document.getElementById('ov-stat');
  const btn     = document.getElementById('start-btn');

  ov.classList.remove('hidden');
  ovTitle.textContent = '[ SYSTEM BREACH ]';
  ovTitle.className = 'ov-title red';
  ovSub.textContent  = 'NEURAL LINK SEVERED — CONNECTION LOST';
  ovStat.innerHTML   = `SCORE <b>${String(score).padStart(3,'0')}</b> · LEVEL <b>${String(level).padStart(2,'0')}</b> · HI <b>${String(hiScore).padStart(3,'0')}</b>`;
  btn.textContent = '[ RECONNECT ]';
}

function startGame() {
  document.getElementById('overlay').classList.add('hidden');
  initGame();
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, speed);
  draw();
}

// Controls
const KEY_MAP = {
  ArrowUp:'UP',w:'UP',W:'UP',
  ArrowDown:'DOWN',s:'DOWN',S:'DOWN',
  ArrowLeft:'LEFT',a:'LEFT',A:'LEFT',
  ArrowRight:'RIGHT',d:'RIGHT',D:'RIGHT',
};
const DIR_MAP = {
  UP:{x:0,y:-1}, DOWN:{x:0,y:1}, LEFT:{x:-1,y:0}, RIGHT:{x:1,y:0}
};
const OPPOSITE = { UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT' };

function applyDir(d) {
  if (!alive) return;
  const cur = Object.keys(DIR_MAP).find(k=>DIR_MAP[k].x===dir.x&&DIR_MAP[k].y===dir.y);
  if (d !== OPPOSITE[cur]) nextDir = DIR_MAP[d];
}

document.addEventListener('keydown', e => {
  if (e.key === ' ' && !alive) { startGame(); return; }
  if (KEY_MAP[e.key]) { e.preventDefault(); applyDir(KEY_MAP[e.key]); }
});

document.querySelectorAll('.dpad-btn').forEach(btn => {
  btn.addEventListener('touchstart', e => { e.preventDefault(); applyDir(btn.dataset.dir); }, {passive:false});
  btn.addEventListener('mousedown',  e => { e.preventDefault(); applyDir(btn.dataset.dir); });
});

document.getElementById('start-btn').addEventListener('click', startGame);

// Touch swipe
let tx=0,ty=0;
canvas.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)) applyDir(dx>0?'RIGHT':'LEFT');
  else applyDir(dy>0?'DOWN':'UP');
}, {passive:true});

// Initial draw
initGame();
draw();
</script>
</body>
</html>
